# Build the site and deploy it to GitHub Pages. Runs only on pushes to main
# (and by hand). It never commits or pushes to any repository.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull reference docs from the code repos
        run: scripts/fetch-reference.sh
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: mkdocs build --strict --site-dir site
      # 404.html uses root-relative links under the site path, so check a copy
      # laid out as it is served: <root>/radio-docs/...
      - name: Stage the site for the link check
        run: mkdir -p _linkcheck && cp -R site _linkcheck/radio-docs
      - name: Check links in the built site (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/_linkcheck" "_linkcheck/**/*.html"
          fail: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
